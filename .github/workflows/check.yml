name: Check and deploy website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CMS_AUTH_URL: ${{ vars.CMS_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: verified-site
          path: dist/
          if-no-files-found: error
          retention-days: 3
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: '8ff08acf55c2976a352f2dcc15b7612f'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: dist/
      - name: Verify the lab deployment target
        run: node scripts/check-ci-target.mjs
      - name: Deploy the verified site to the lab account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Add the lab Worker token as the repository secret CLOUDFLARE_API_TOKEN.'
            exit 1
          fi
          npx --no-install wrangler deploy --config wrangler.jsonc
