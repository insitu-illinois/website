# Generated from src/lib/content-model.mjs.
backend:
  name: github
  repo: insitu-illinois/website
  branch: main
  auth_scope: public_repo
  base_url: https://insitu-cms-auth.insituillinois.workers.dev
media_folder: public/media
public_folder: /media
collections:
  - name: themes
    label: Themes
    folder: src/content/themes
    create: true
    format: json
    extension: json
    identifier_field: name
    slug: "{{fields.slug}}"
    fields:
      - name: slug
        label: Slug
        widget: string
        required: true
        hint: Permanent identifier. Do not change after publishing; other records refer
          to it.
        pattern:
          - ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - Use lowercase letters, numbers, and hyphens.
      - name: draft
        label: Draft
        widget: boolean
        required: false
        hint: Turn on to hide this entry from the website while you prepare it; GitHub
          files remain public.
        default: false
      - name: name
        label: Name
        widget: string
        required: true
        hint: Enter the name as it should appear on the website.
      - name: question
        label: Question
        widget: text
        required: false
        hint: Write the guiding research question for this theme.
      - name: description
        label: Description
        widget: text
        required: false
        hint: Write a short, approved description for readers.
      - name: image
        label: Image
        widget: object
        required: false
        hint: Optional. Adding an image requires both a file and meaningful alt text.
        collapsed: true
        fields:
          - name: src
            label: Image
            widget: image
            required: true
            hint: Upload or choose the image file you have permission to publish.
            pattern:
              - ^/media/(?!.*\.\.)(?!.*[?#]).+\.(?:png|jpg|jpeg|webp|avif|gif|svg)$
              - Upload an image to the media folder.
            choose_url: false
          - name: alt
            label: Alt text
            widget: string
            required: true
            hint: Describe the image for people who cannot see it; for a headshot, use
              Portrait of followed by the person’s name.
            pattern:
              - .*\S.*
              - Describe the image.
  - name: people
    label: People
    folder: src/content/people
    create: true
    format: json
    extension: json
    identifier_field: name
    slug: "{{fields.slug}}"
    fields:
      - name: slug
        label: Slug
        widget: string
        required: true
        hint: Permanent identifier. Do not change after publishing; other records refer
          to it.
        pattern:
          - ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - Use lowercase letters, numbers, and hyphens.
      - name: draft
        label: Draft
        widget: boolean
        required: false
        hint: Turn on to hide this entry from the website while you prepare it; GitHub
          files remain public.
        default: false
      - name: name
        label: Name
        widget: string
        required: true
        hint: Enter the name as it should appear on the website.
      - name: role
        label: Role
        widget: select
        required: false
        hint: Collaborator and Alumni have their own sections; all other roles appear
          under Current members.
        options:
          - label: Director
            value: director
          - label: Member
            value: member
          - label: Faculty
            value: faculty
          - label: PhD student
            value: phd
          - label: Master’s student
            value: ms
          - label: Undergraduate
            value: undergrad
          - label: Collaborator
            value: collaborator
          - label: Alumni
            value: alumni
          - label: Visitor
            value: visitor
      - name: photo
        label: Photo
        widget: object
        required: false
        hint: Optional. Adding an image requires both a file and meaningful alt text.
        collapsed: true
        fields:
          - name: src
            label: Image
            widget: image
            required: true
            hint: Upload or choose the image file you have permission to publish.
            pattern:
              - ^/media/(?!.*\.\.)(?!.*[?#]).+\.(?:png|jpg|jpeg|webp|avif|gif|svg)$
              - Upload an image to the media folder.
            choose_url: false
          - name: alt
            label: Alt text
            widget: string
            required: true
            hint: Describe the image for people who cannot see it; for a headshot, use
              Portrait of followed by the person’s name.
            pattern:
              - .*\S.*
              - Describe the image.
      - name: bio
        label: Bio
        widget: text
        required: false
        hint: Use an approved biography. Alumni biographies are saved but not displayed;
          other roles get a profile page. Leave blank for a list entry only.
      - name: affiliations
        label: Affiliations
        widget: text
        required: false
        hint: List confirmed current appointments and affiliations, one per line; leave
          blank if not supplied.
      - name: website
        label: Website
        widget: string
        required: false
        hint: Paste the full address of the person’s website, or leave blank.
        pattern:
          - ^https?://\S+$
          - Use a full http or https URL.
      - name: universityProfile
        label: University profile
        widget: string
        required: false
        hint: Paste the verified university directory page for this person, or leave
          blank.
        pattern:
          - ^https?://\S+$
          - Use a full http or https URL.
      - name: linkedin
        label: LinkedIn
        widget: string
        required: false
        hint: Paste this person’s verified LinkedIn profile URL, or leave blank; do not
          use a search results page.
        pattern:
          - ^https?://\S+$
          - Use a full http or https URL.
      - name: scholar
        label: Google Scholar
        widget: string
        required: false
        hint: Paste the person’s Google Scholar profile address, or leave blank.
        pattern:
          - ^https?://\S+$
          - Use a full http or https URL.
      - name: email
        label: Email
        widget: string
        required: false
        hint: Enter the contact email; in Lab contact, this single address is shared by
          Join, About, and the footer.
        pattern:
          - ^[^@\s]+@[^@\s]+\.[^@\s]+$
          - Use an email address.
      - name: themes
        label: Themes
        widget: relation
        required: false
        hint: Choose the research themes connected to this work.
        collection: themes
        search_fields:
          - name
        value_field: "{{slug}}"
        display_fields:
          - name
        multiple: true
      - name: order
        label: Order
        widget: number
        required: false
        hint: Smaller numbers appear first within the person’s section; equal numbers
          sort by name.
        default: 100
        value_type: int
        min: 0
