# Generated from src/lib/content-model.mjs.
backend:
  name: github
  repo: insitu-illinois/website
  branch: main
  auth_scope: public_repo
  base_url: https://insitu-cms-auth.insituillinois.workers.dev
media_folder: public/media
public_folder: /media
collections:
  - name: themes
    label: Themes
    folder: src/content/themes
    create: true
    format: json
    extension: json
    identifier_field: name
    slug: "{{fields.slug}}"
    fields:
      - name: slug
        label: Slug
        widget: string
        required: true
        pattern:
          - ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - Use lowercase letters, numbers, and hyphens.
        hint: Permanent identifier. Do not change after publishing; other records refer
          to it.
      - name: draft
        label: Draft
        widget: boolean
        required: false
        default: false
      - name: name
        label: Name
        widget: string
        required: true
      - name: question
        label: Question
        widget: text
        required: false
      - name: description
        label: Description
        widget: text
        required: false
      - name: image
        label: Image
        widget: object
        required: false
        collapsed: true
        hint: Optional. Adding an image requires both a file and meaningful alt text.
        fields:
          - name: src
            label: Image
            widget: image
            required: true
            pattern:
              - ^/media/(?!.*\.\.)(?!.*[?#]).+\.(?:png|jpg|jpeg|webp|avif|gif|svg)$
              - Upload an image to the media folder.
            choose_url: false
          - name: alt
            label: Alt text
            widget: string
            required: true
            pattern:
              - .*\S.*
              - Describe the image.
